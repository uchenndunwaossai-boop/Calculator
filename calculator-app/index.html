<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f6fb">
    <meta name="description" content="A clean, easy-to-use calculator.">
    <title>Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-labelledby="calculator-title">
        <h1 id="calculator-title">Calculator</h1>

        <section class="screen" aria-label="Calculator display">
            <div id="previous" aria-live="polite"></div>
            <output id="display" aria-live="assertive" aria-atomic="true">0</output>
        </section>

        <div class="buttons" aria-label="Calculator keys">
            <button type="button" data-action="clear" class="utility" aria-label="Clear all">AC</button>
            <button type="button" data-action="delete" class="utility" aria-label="Delete last digit">DEL</button>
            <button type="button" data-value="%" aria-label="Percent">%</button>
            <button type="button" data-value="÷" class="operator" aria-label="Divide">÷</button>

            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" data-value="×" class="operator" aria-label="Multiply">×</button>

            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-value="−" class="operator" aria-label="Subtract">−</button>

            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="+" class="operator" aria-label="Add">+</button>

            <button type="button" data-value="0" class="zero">0</button>
            <button type="button" data-value=".">.</button>
            <button type="button" data-action="calculate" class="equal" aria-label="Calculate">=</button>
        </div>
        <p class="keyboard-hint">You can also use your keyboard</p>
    </main>

    <script src="scripts.js" defer></script>
</body>
</html>
